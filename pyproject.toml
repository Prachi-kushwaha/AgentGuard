[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "A reliability and execution control layer for Python functions and AI agent tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Prachi Kushawaha" }
]
keywords = [
    "ai-agents",
    "reliability",
    "retry",
    "execution-engine",
    "circuit-breaker",
    "idempotency"
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]