site_name: AgentGuard
site_description: Reliable execution, idempotency, and recovery for Python applications.
site_url: https://prachi-kushwaha.github.io/agentguard_docs/
repo_url: https://github.com/Prachi-kushwaha/AgentGuard
repo_name: Prachi-kushwaha/AgentGuard

copyright: Copyright &copy; 2026 AgentGuard


theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

  palette:
    - scheme: default
      primary: teal
      accent: green
    - scheme: slate
      primary: teal
      accent: lime

extra_css:
  - stylesheet/extra.css


plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md

  - Execution Engine:
      - Overview: engine/overview.md
      - API Reference:
          - Coordinator:  api/coordinator.md
          - Engine: api/engine.md
          - Recovery: api/recovery.md
          - Storage: api/storage.md